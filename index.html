<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEX AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{height:65px;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;font-size:23px;font-weight:bold}
button{background:white;color:black;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:bold;margin:3px}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#303030;color:white}
.hidden{display:none!important}
main{max-width:1200px;margin:auto;padding:15px}
h1{text-align:center;margin-top:35px;font-size:34px}
h1 span{color:#aaa}
p{text-align:center;color:#aaa}
.panel{background:#151515;border:1px solid #303030;border-radius:16px;padding:15px;margin:12px 0}
input{width:100%;padding:14px;margin:7px 0;background:#090909;color:white;border:1px solid #444;border-radius:10px;font-size:15px}
#workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;align-items:start}
#sidebar{height:calc(100vh - 100px);position:sticky;top:10px;display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{display:flex;justify-content:space-between;align-items:center}
#chatList{display:flex;flex-direction:column;gap:7px;overflow-y:auto;margin-top:12px}
.chat-item{width:100%;text-align:right;background:#252525;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;flex-shrink:0}
.chat-item.active{background:#555;color:white}
#chatArea{min-width:0}
.chat-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#chat{height:calc(100vh - 230px);min-height:300px;overflow:auto;padding:10px}
.msg{padding:14px;margin:10px 0;border-radius:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#303030}
.bot{background:#151515;border:1px solid #333}
.msg img{display:block;max-width:min(100%,320px);max-height:300px;object-fit:contain;border-radius:12px;margin-top:8px}
form#chatForm{display:flex;gap:7px;align-items:center;background:#151515;padding:8px;border:1px solid #444;border-radius:15px}
#message{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;margin:0}
#sendBtn{margin:0}
#attachBtn{font-size:21px;padding:8px 13px;margin:0}
#attachMenu{position:absolute;bottom:65px;right:0;background:#222;border:1px solid #444;border-radius:13px;padding:8px;z-index:5;width:180px;box-shadow:0 5px 20px #0008}
#attachMenu button{display:block;width:100%;margin:4px 0;text-align:right;background:#333;color:white}
#composer{position:relative}
#previewBox{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px;background:#202020;border-radius:12px}
#previewImage{width:65px;height:65px;object-fit:cover;border-radius:8px}
#editBox{background:#202020;padding:12px;border-radius:12px;margin-bottom:8px}
#editPrompt{margin:5px 0}
#editMessage{font-size:13px;text-align:right;margin:7px 0}
#editImageBtn{width:100%;margin:4px 0;background:#fff;color:#000}
#cameraModal{position:fixed;inset:0;background:#000e;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}
#cameraPanel{width:100%;max-width:500px;background:#171717;border:1px solid #444;border-radius:16px;padding:12px}
#cameraVideo{width:100%;max-height:60vh;background:#000;border-radius:12px;object-fit:contain}
.camera-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
small{display:block;text-align:center;color:#888;margin:12px}
#sidebarBackdrop{display:none}
body.sidebar-closed #workspace{grid-template-columns:minmax(0,1fr)}
body.sidebar-closed #sidebar{display:none}
body.light-mode{background:#f5f5f5;color:#111}
body.light-mode header{border-color:#ddd}
body.light-mode .panel,body.light-mode .bot,body.light-mode form#chatForm{background:white;color:#111;border-color:#ddd}
body.light-mode input{background:white;color:#111;border-color:#ccc}
body.light-mode .user{background:#e5e5e5}
body.light-mode .secondary{background:#ddd;color:#111}
body.light-mode p{color:#555}
body.light-mode .chat-item{background:#e5e5e5;color:#111}
body.light-mode .chat-item.active{background:#bbb;color:#111}
body.light-mode #attachMenu{background:white;border-color:#ccc}
body.light-mode #attachMenu button{background:#eee;color:#111}
body.light-mode #previewBox,body.light-mode #editBox{background:#eee}
@media(max-width:700px){
main{padding:10px}
#workspace{display:block}
#sidebar{position:fixed;top:0;right:0;width:280px;max-width:85vw;height:100dvh;z-index:20;border-radius:0 0 0 15px;margin:0;transform:translateX(110%);transition:transform .25s ease}
body.sidebar-open #sidebar{transform:translateX(0)}
body.sidebar-closed #sidebar{display:flex}
#sidebarBackdrop{position:fixed;inset:0;background:#0009;z-index:19}
body.sidebar-open #sidebarBackdrop{display:block}
#chat{height:calc(100dvh - 230px);min-height:250px}
h1{font-size:27px}
}
</style>
</head>

<body>
<header>
<span>◈ ALEX AI</span>
<button id="themeBtn" class="secondary">الوضع الأبيض</button>
</header>

<main>
<h1>أهلاً بك في <span>ALEX AI</span></h1>
<p>مساعدك الذكي في كل شيء</p>

<section id="auth" class="panel">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول</button>
<button id="signupBtn" class="secondary">إنشاء حساب</button>
<p id="authMessage"></p>
</section>

<section id="app" class="hidden">
<div class="panel">
<span id="userEmail"></span>
<button id="logoutBtn" class="secondary">خروج</button>
</div>

<div id="workspace">
<aside id="sidebar" class="panel">
<div class="sidebar-head">
<h3>محادثاتي</h3>
<button id="closeSidebarBtn" class="secondary">✕</button>
</div>
<button id="newChatBtn">＋ شات جديد</button>
<div id="chatList"></div>
</aside>

<div id="sidebarBackdrop"></div>

<div id="chatArea">
<div class="chat-toolbar">
<button id="menuBtn" class="secondary">☰</button>
<strong>ALEX AI</strong>
</div>

<div id="chat" class="panel"></div>

<div id="composer">

<div id="previewBox" class="hidden">
<img id="previewImage" alt="معاينة الصورة">
<span>الصورة جاهزة</span>
<button id="removeImageBtn" class="secondary">✕</button>
</div>

<div id="editBox" class="hidden">
<strong>✨ تعديل الصورة بالذكاء الاصطناعي</strong>
<input id="editPrompt" placeholder="مثلاً: غيّر الخلفية إلى شاطئ وقت الغروب">
<button id="editImageBtn">✨ تنفيذ التعديل</button>
<p id="editMessage"></p>
</div>

<div id="attachMenu" class="hidden">
<button id="galleryBtn">🖼️ اختيار صورة</button>
<button id="cameraBtn">📷 فتح الكاميرا</button>
</div>

<form id="chatForm">
<button id="attachBtn" type="button" class="secondary">＋</button>
<input id="message" placeholder="اكتب رسالتك هنا...">
<button id="sendBtn" type="submit">➤</button>
</form>

<input id="imageInput" type="file" accept="image/*" class="hidden">
</div>
</div>
</div>

<small>نسخة تجريبية من ALEX AI</small>
</section>
</main>

<div id="cameraModal" class="hidden">
<div id="cameraPanel">
<h3>الكاميرا</h3>
<video id="cameraVideo" autoplay playsinline></video>
<div class="camera-actions">
<button id="flashBtn" class="secondary">⚡ تشغيل الفلاش</button>
<button id="captureBtn">📸 التقاط الصورة</button>
<button id="closeCameraBtn" class="secondary">إغلاق</button>
</div>
<p id="cameraMessage"></p>
</div>
</div>

<script>
const SUPABASE_URL = "https://hbfdrtgmalvlixwuujgf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vBz40TiOn08eysk3uiQhYQ_lLv_QphJ";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let currentUser=null,chats=[],activeChatId=null,sending=false;
let selectedImage=null,cameraStream=null,torchOn=false,editing=false;

function showMessage(id,text){$(id).textContent=text}
function storageKey(){return "alex-chats-"+currentUser.id}
function oldStorageKey(){return "alex-chat-"+currentUser.id}
function activeChat(){return chats.find(c=>c.id===activeChatId)}

function saveChats(){
if(!currentUser)return;
try{localStorage.setItem(storageKey(),JSON.stringify(chats))}
catch(e){console.warn("تعذر حفظ المحادثات",e)}
}

function renderChat(){
const chat=activeChat();
$("chat").replaceChildren();
if(!chat)return;

chat.messages.forEach(item=>{
const div=document.createElement("div");
div.className="msg "+(item.role==="user"?"user":"bot");
const text=document.createElement("div");
text.textContent=item.text||"";
div.appendChild(text);

if(item.image){
const img=document.createElement("img");
img.src=item.image;
img.alt="صورة مرسلة";
div.appendChild(img);
}
$("chat").appendChild(div);
});
$("chat").scrollTop=$("chat").scrollHeight;
}

function renderChatList(){
$("chatList").replaceChildren();
chats.slice().reverse().forEach(chat=>{
const btn=document.createElement("button");
btn.className="chat-item"+(chat.id===activeChatId?" active":"");
const first=chat.messages.find(m=>m.role==="user");
btn.textContent=chat.title||(first?first.text.slice(0,25):"محادثة جديدة");
btn.disabled=sending||editing;
btn.onclick=()=>{
if(sending||editing)return;
activeChatId=chat.id;
renderChat();
renderChatList();
closeSidebar();
};
$("chatList").appendChild(btn);
});
}

function saveAndRender(){saveChats();renderChat();renderChatList()}

function createNewChat(){
if(sending||editing)return;
const chat={id:String(Date.now()),title:"محادثة جديدة",messages:[]};
chats.push(chat);
activeChatId=chat.id;
saveAndRender();
closeSidebar();
}

function loadChats(){
try{
const saved=localStorage.getItem(storageKey());
if(saved){
const parsed=JSON.parse(saved);
chats=Array.isArray(parsed)?parsed:[];
}else{
const old=JSON.parse(localStorage.getItem(oldStorageKey())||"[]");
chats=[];
if(Array.isArray(old)&&old.length){
chats.push({id:String(Date.now()),title:"المحادثة القديمة",messages:old});
}
}
}catch{chats=[]}

if(!chats.length){
chats=[{id:String(Date.now()),title:"محادثة جديدة",messages:[]}];
}
activeChatId=chats[chats.length-1].id;
saveAndRender();
}

function updateSession(session){
currentUser=session?.user||null;
$("auth").classList.toggle("hidden",!!currentUser);
$("app").classList.toggle("hidden",!currentUser);
if(currentUser){
$("userEmail").textContent="الحساب: "+currentUser.email;
loadChats();
}else{
$("chat").replaceChildren();
$("chatList").replaceChildren();
chats=[];
activeChatId=null;
closeSidebar();
}
}

function openSidebar(){document.body.classList.add("sidebar-open")}
function closeSidebar(){document.body.classList.remove("sidebar-open")}

$("menuBtn").onclick=()=>{
document.body.classList.contains("sidebar-open")?closeSidebar():openSidebar();
};
$("closeSidebarBtn").onclick=closeSidebar;
$("sidebarBackdrop").onclick=closeSidebar;
$("newChatBtn").onclick=createNewChat;

/* تسجيل الدخول */
$("loginBtn").onclick=async()=>{
const email=$("email").value.trim(),password=$("password").value;
if(!email||!password)return showMessage("authMessage","اكتب البريد الإلكتروني وكلمة المرور");
$("loginBtn").disabled=true;
showMessage("authMessage","جاري تسجيل الدخول...");
try{
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error)throw error;
await updateSession(data.session);
}catch(error){showMessage("authMessage",error.message||"تعذر تسجيل الدخول")}
finally{$("loginBtn").disabled=false}
};

/* إنشاء حساب */
$("signupBtn").onclick=async()=>{
const email=$("email").value.trim(),password=$("password").value;
if(!email||!password)return showMessage("authMessage","اكتب البريد الإلكتروني وكلمة المرور");
if(password.length<6)return showMessage("authMessage","كلمة المرور لازم تكون 6 أحرف على الأقل");
$("signupBtn").disabled=true;
showMessage("authMessage","جاري إنشاء الحساب...");
try{
const {data,error}=await db.auth.signUp({email,password});
if(error)throw error;
if(data.session)await updateSession(data.session);
else showMessage("authMessage","راجع بريدك الإلكتروني لتأكيد الحساب");
}catch(error){showMessage("authMessage",error.message||"تعذر إنشاء الحساب")}
finally{$("signupBtn").disabled=false}
};

/* تسجيل الخروج */
$("logoutBtn").onclick=async()=>{
stopCamera();
const {error}=await db.auth.signOut();
if(error){alert(error.message);return}
await updateSession(null);
};

/* الصور */
function showPreview(dataUrl){
selectedImage=dataUrl;
$("previewImage").src=dataUrl;
$("previewBox").classList.remove("hidden");
$("editBox").classList.remove("hidden");
$("attachMenu").classList.add("hidden");
showMessage("editMessage","");
}

function clearSelectedImage(){
selectedImage=null;
$("previewImage").removeAttribute("src");
$("previewBox").classList.add("hidden");
$("editBox").classList.add("hidden");
$("editPrompt").value="";
$("editMessage").textContent="";
$("imageInput").value="";
}

async function compressImage(file){
if(!file.type.startsWith("image/"))throw new Error("اختار صورة صحيحة");
const source=await createImageBitmap(file);
const maxSide=1280;
const scale=Math.min(1,maxSide/Math.max(source.width,source.height));
const canvas=document.createElement("canvas");
canvas.width=Math.round(source.width*scale);
canvas.height=Math.round(source.height*scale);
const ctx=canvas.getContext("2d");
ctx.drawImage(source,0,0,canvas.width,canvas.height);
source.close();
return canvas.toDataURL("image/jpeg",0.72);
}

$("attachBtn").onclick=()=>{
$("attachMenu").classList.toggle("hidden");
};

$("galleryBtn").onclick=()=>{
$("attachMenu").classList.add("hidden");
$("imageInput").click();
};

$("imageInput").onchange=async()=>{
const file=$("imageInput").files?.[0];
if(!file)return;
try{
const image=await compressImage(file);
if(image.length>4000000)throw new Error("حجم الصورة كبير، اختار صورة أصغر");
showPreview(image);
}catch(error){alert(error.message||"تعذر فتح الصورة")}
};

$("removeImageBtn").onclick=clearSelectedImage;

/* تعديل الصورة بالذكاء الاصطناعي */
$("editImageBtn").onclick=async()=>{
if(editing||!selectedImage)return;

const prompt=$("editPrompt").value.trim();
if(!prompt){
showMessage("editMessage","اكتب وصف التعديل الأول");
return;
}

editing=true;
$("editImageBtn").disabled=true;
$("editImageBtn").textContent="جاري تعديل الصورة...";
showMessage("editMessage","جاري تنفيذ التعديل، استنى شوية...");

try{
const {data,error}=await db.auth.getSession();
if(error)throw error;

const token=data.session?.access_token;
if(!token)throw new Error("سجل دخولك مرة تانية");

const response=await fetch("/api/edit",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({
image:selectedImage,
prompt:prompt
})
});

const result=await response.json();

if(!response.ok){
throw new Error(result.error||"فشل تعديل الصورة");
}

if(!result.image)throw new Error("ملقيناش صورة ناتجة");

showPreview(result.image);
$("editPrompt").value="";
showMessage("editMessage","تم التعديل! تقدر تبعت الصورة في الشات.");
}catch(error){
showMessage("editMessage","تعذر التعديل: "+error.message);
}finally{
editing=false;
$("editImageBtn").disabled=false;
$("editImageBtn").textContent="✨ تنفيذ التعديل";
}
};

/* الكاميرا */
async function openCamera(){
$("attachMenu").classList.add("hidden");
$("cameraModal").classList.remove("hidden");
showMessage("cameraMessage","جاري فتح الكاميرا...");
try{
cameraStream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:"environment"}},
audio:false
});
$("cameraVideo").srcObject=cameraStream;
showMessage("cameraMessage","الكاميرا جاهزة");
const track=cameraStream.getVideoTracks()[0];
const capabilities=track.getCapabilities?.();
$("flashBtn").classList.toggle("hidden",!capabilities?.torch);
torchOn=false;
$("flashBtn").textContent="⚡ تشغيل الفلاش";
}catch(error){
showMessage("cameraMessage","مش قادر أفتح الكاميرا. راجع إذن الكاميرا أو افتح الموقع من متصفح يدعمها.");
}
}

function stopCamera(){
if(cameraStream){
cameraStream.getTracks().forEach(track=>track.stop());
cameraStream=null;
}
torchOn=false;
$("cameraVideo").srcObject=null;
$("cameraModal").classList.add("hidden");
}

$("cameraBtn").onclick=openCamera;
$("closeCameraBtn").onclick=stopCamera;

$("flashBtn").onclick=async()=>{
const track=cameraStream?.getVideoTracks()[0];
if(!track)return;
try{
torchOn=!torchOn;
await track.applyConstraints({advanced:[{torch:torchOn}]});
$("flashBtn").textContent=torchOn?"⚡ إيقاف الفلاش":"⚡ تشغيل الفلاش";
}catch(error){
torchOn=false;
showMessage("cameraMessage","الفلاش غير مدعوم في الكاميرا دي");
}
};

$("captureBtn").onclick=()=>{
const video=$("cameraVideo");
if(!video.videoWidth)return showMessage("cameraMessage","استنى لحد ما الكاميرا تشتغل");
const canvas=document.createElement("canvas");
const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));
canvas.width=Math.round(video.videoWidth*scale);
canvas.height=Math.round(video.videoHeight*scale);
canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
const image=canvas.toDataURL("image/jpeg",0.72);
if(image.length>4000000)return showMessage("cameraMessage","الصورة كبيرة، حاول تاني");
showPreview(image);
stopCamera();
};

/* إرسال الرسائل والصور */
$("chatForm").onsubmit=async e=>{
e.preventDefault();
if(sending||editing||!currentUser)return;

const message=$("message").value.trim();
const image=selectedImage;
if(!message&&!image)return;

const chat=activeChat();
if(!chat)return;

sending=true;
$("message").value="";
clearSelectedImage();

chat.messages.push({role:"user",text:message,image:image||null});
if(chat.title==="محادثة جديدة"){
chat.title=message?message.slice(0,25):"صورة جديدة";
}
saveAndRender();

$("sendBtn").disabled=true;
$("attachBtn").disabled=true;
$("newChatBtn").disabled=true;

chat.messages.push({role:"assistant",text:"جاري التفكير..."});
saveAndRender();

try{
const {data,error}=await db.auth.getSession();
if(error)throw error;
const token=data.session?.access_token;
if(!token)throw new Error("سجل دخولك مرة تانية");

/* إرسال آخر 4 رسائل فقط، والصورة الحالية فقط */
const recentMessages=chat.messages.slice(0,-1).slice(-4);

const history=recentMessages.map((item,index)=>{
const isCurrentMessage=index===recentMessages.length-1;

if(item.role==="user"&&isCurrentMessage&&image){
const parts=[];

if(item.text){
parts.push({type:"text",text:item.text.slice(0,1500)});
}

parts.push({
type:"image_url",
image_url:{url:image}
});

return {role:"user",content:parts};
}

return {
role:item.role,
content:(item.text||"").slice(0,1500)
};
});

const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),60000);
let response;

try{
response=await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({messages:history}),
signal:controller.signal
});
}finally{
clearTimeout(timeout);
}

const result=await response.json();
if(!response.ok)throw new Error(result.error||"حصل خطأ في خدمة الذكاء الاصطناعي");

chat.messages[chat.messages.length-1].text=result.reply||"مفيش رد متاح";

}catch(error){
chat.messages[chat.messages.length-1].text=
error.name==="AbortError"?"الطلب استغرق وقت طويل. حاول تاني.":"حصل خطأ: "+error.message;
}finally{
saveChats();
renderChat();
renderChatList();
sending=false;
$("sendBtn").disabled=false;
$("attachBtn").disabled=false;
$("newChatBtn").disabled=false;
$("message").focus();
}
};

/* تغيير الوضع */
$("themeBtn").onclick=()=>{
const light=document.body.classList.toggle("light-mode");
localStorage.setItem("alex-theme",light?"light":"dark");
$("themeBtn").textContent=light?"الوضع الأسود":"الوضع الأبيض";
};

if(localStorage.getItem("alex-theme")==="light"){
document.body.classList.add("light-mode");
$("themeBtn").textContent="الوضع الأسود";
}

db.auth.onAuthStateChange((_event,session)=>updateSession(session));
db.auth.getSession().then(({data,error})=>{
if(error){console.error(error);return}
updateSession(data.session);
});
</script>
</body>
</html>
