
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEX AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#080808;color:#fff;
font-family:Arial,sans-serif;transition:.2s
}
header{
height:65px;padding:10px 18px;
display:flex;justify-content:space-between;
align-items:center;border-bottom:1px solid #292929;
font-size:23px;font-weight:bold
}
button{
background:#fff;color:#000;border:0;
border-radius:10px;padding:11px 15px;
cursor:pointer;font-weight:bold;margin:3px
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#303030;color:white}
.hidden{display:none!important}

main{max-width:1200px;margin:auto;padding:15px}
h1{text-align:center;margin-top:35px;font-size:34px}
h1 span{color:#aaa}
p{text-align:center;color:#aaa}

.panel{
background:#151515;border:1px solid #303030;
border-radius:16px;padding:15px;margin:12px 0
}
input{
width:100%;padding:14px;margin:7px 0;
background:#090909;color:white;
border:1px solid #444;border-radius:10px;font-size:15px
}

/* مساحة التطبيق */
#workspace{
display:grid;
grid-template-columns:260px minmax(0,1fr);
gap:12px;align-items:start;
transition:.2s
}

/* القائمة الجانبية */
#sidebar{
height:calc(100vh - 100px);
position:sticky;top:10px;
margin:0;display:flex;flex-direction:column;
overflow:hidden
}
.sidebar-head{
display:flex;justify-content:space-between;
align-items:center;gap:5px
}
.sidebar-head h3{margin:8px}
#chatList{
display:flex;flex-direction:column;gap:7px;
overflow-y:auto;margin-top:12px
}
.chat-item{
width:100%;text-align:right;
background:#252525;color:#ddd;
overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;margin:0;flex-shrink:0
}
.chat-item.active{background:#555;color:white}

/* منطقة المحادثة */
#chatArea{min-width:0}
.chat-toolbar{
display:flex;align-items:center;
gap:8px;margin-bottom:10px
}
#chat{
height:calc(100vh - 230px);
min-height:300px;overflow:auto;padding:10px
}
.msg{
padding:14px;margin:10px 0;
border-radius:14px;line-height:1.7;
white-space:pre-wrap;overflow-wrap:anywhere
}
.user{background:#303030}
.bot{background:#151515;border:1px solid #333}

form#chatForm{
display:flex;gap:7px;background:#151515;
padding:8px;border:1px solid #444;border-radius:15px
}
#message{
flex:1;min-width:0;background:transparent;
border:0;outline:0;color:white;margin:0
}
small{display:block;text-align:center;color:#888;margin:12px}

#sidebarBackdrop{display:none}

/* إخفاء القائمة على الكمبيوتر */
body.sidebar-closed #workspace{
grid-template-columns:minmax(0,1fr)
}
body.sidebar-closed #sidebar{display:none}

/* الوضع الأبيض */
body.light-mode{background:#f5f5f5;color:#111}
body.light-mode header{border-color:#ddd}
body.light-mode .panel,
body.light-mode .bot,
body.light-mode form#chatForm{
background:#fff;color:#111;border-color:#ddd
}
body.light-mode input{
background:#fff;color:#111;border-color:#ccc
}
body.light-mode .user{background:#e5e5e5}
body.light-mode .secondary{background:#ddd;color:#111}
body.light-mode p{color:#555}
body.light-mode .chat-item{background:#e5e5e5;color:#111}
body.light-mode .chat-item.active{background:#bbb;color:#111}

/* الموبايل */
@media(max-width:700px){
main{padding:10px}
#workspace{display:block}
#sidebar{
position:fixed;top:0;right:0;
width:280px;max-width:85vw;
height:100dvh;z-index:20;
border-radius:0 0 0 15px;
margin:0;transform:translateX(110%);
transition:transform .25s ease;
}
body.sidebar-open #sidebar{transform:translateX(0)}
body.sidebar-closed #sidebar{display:flex}
#sidebarBackdrop{
position:fixed;inset:0;background:#0009;
z-index:19
}
body.sidebar-open #sidebarBackdrop{display:block}
#chat{height:calc(100dvh - 230px);min-height:250px}
h1{font-size:27px}
}
</style>
</head>

<body>

<header>
<span>◈ ALEX AI</span>
<button id="themeBtn" class="secondary">الوضع الأبيض</button>
</header>

<main>
<h1>أهلاً بك في <span>ALEX AI</span></h1>
<p>مساعدك الذكي في كل شيء</p>

<section id="auth" class="panel">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول</button>
<button id="signupBtn" class="secondary">إنشاء حساب</button>
<p id="authMessage"></p>
</section>

<section id="app" class="hidden">

<div class="panel">
<span id="userEmail"></span>
<button id="logoutBtn" class="secondary">خروج</button>
</div>

<div id="workspace">

<aside id="sidebar" class="panel">
<div class="sidebar-head">
<h3>محادثاتي</h3>
<button id="closeSidebarBtn" class="secondary">✕</button>
</div>
<button id="newChatBtn">＋ شات جديد</button>
<div id="chatList"></div>
</aside>

<div id="sidebarBackdrop"></div>

<div id="chatArea">
<div class="chat-toolbar">
<button id="menuBtn" class="secondary">☰</button>
<strong>ALEX AI</strong>
</div>

<div id="chat" class="panel"></div>

<form id="chatForm">
<input id="message" placeholder="اكتب رسالتك هنا..." required>
<button id="sendBtn" type="submit">➤</button>
</form>
</div>

</div>

<small>نسخة تجريبية من ALEX AI</small>
</section>
</main>

<script>
const SUPABASE_URL = "https://hbfdrtgmalvlixwuujgf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vBz40TiOn08eysk3uiQhYQ_lLv_QphJ";

const db = window.supabase.createClient(
SUPABASE_URL,SUPABASE_ANON_KEY
);

const $ = id => document.getElementById(id);

let currentUser = null;
let chats = [];
let activeChatId = null;
let sending = false;

function showMessage(id,text){
$(id).textContent = text;
}

function storageKey(){
return "alex-chats-" + currentUser.id;
}

function oldStorageKey(){
return "alex-chat-" + currentUser.id;
}

function activeChat(){
return chats.find(c => c.id === activeChatId);
}

function saveChats(){
if(!currentUser)return;
localStorage.setItem(storageKey(),JSON.stringify(chats));
}

function renderChat(){
const chat = activeChat();
$("chat").replaceChildren();
if(!chat)return;

chat.messages.forEach(item=>{
const div = document.createElement("div");
div.className = "msg " +
(item.role === "user" ? "user" : "bot");
div.textContent = item.text;
$("chat").appendChild(div);
});

$("chat").scrollTop = $("chat").scrollHeight;
}

function renderChatList(){
$("chatList").replaceChildren();

chats.slice().reverse().forEach(chat=>{
const btn = document.createElement("button");
btn.className = "chat-item" +
(chat.id === activeChatId ? " active" : "");

const firstMessage = chat.messages.find(
m => m.role === "user"
);

btn.textContent = chat.title ||
(firstMessage ? firstMessage.text.slice(0,25) : "محادثة جديدة");

btn.disabled = sending;

btn.onclick = ()=>{
if(sending)return;
activeChatId = chat.id;
renderChat();
renderChatList();
closeSidebar();
};

$("chatList").appendChild(btn);
});
}

function saveAndRender(){
saveChats();
renderChat();
renderChatList();
}

function createNewChat(){
if(sending)return;

const chat = {
id:String(Date.now()),
title:"محادثة جديدة",
messages:[]
};

chats.push(chat);
activeChatId = chat.id;
saveAndRender();
closeSidebar();
}

function loadChats(){
try{
const saved = localStorage.getItem(storageKey());

if(saved){
const parsed = JSON.parse(saved);
chats = Array.isArray(parsed) ? parsed : [];
}else{
const old = JSON.parse(
localStorage.getItem(oldStorageKey()) || "[]"
);
chats = [];

if(Array.isArray(old) && old.length){
chats.push({
id:String(Date.now()),
title:"المحادثة القديمة",
messages:old
});
}
}
}catch{
chats = [];
}

if(!chats.length){
chats = [{
id:String(Date.now()),
title:"محادثة جديدة",
messages:[]
}];
}

activeChatId = chats[chats.length-1].id;
saveAndRender();
}

function updateSession(session){
currentUser = session?.user || null;

$("auth").classList.toggle("hidden",!!currentUser);
$("app").classList.toggle("hidden",!currentUser);

if(currentUser){
$("userEmail").textContent = "الحساب: " + currentUser.email;
loadChats();
}else{
$("chat").replaceChildren();
$("chatList").replaceChildren();
chats = [];
activeChatId = null;
closeSidebar();
}
}

/* القائمة الجانبية */
function openSidebar(){
document.body.classList.add("sidebar-open");
}

function closeSidebar(){
document.body.classList.remove("sidebar-open");
}

$("menuBtn").onclick = ()=>{
if(document.body.classList.contains("sidebar-open")){
closeSidebar();
}else{
openSidebar();
}
};

$("closeSidebarBtn").onclick = closeSidebar;
$("sidebarBackdrop").onclick = closeSidebar;

$("newChatBtn").onclick = createNewChat;

/* تسجيل الدخول */
$("loginBtn").onclick = async()=>{
const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){
return showMessage("authMessage","اكتب البريد الإلكتروني وكلمة المرور");
}

$("loginBtn").disabled = true;
showMessage("authMessage","جاري تسجيل الدخول...");

try{
const {data,error} = await db.auth.signInWithPassword({
email,password
});
if(error)throw error;
await updateSession(data.session);
}catch(error){
showMessage("authMessage",error.message || "تعذر تسجيل الدخول");
}finally{
$("loginBtn").disabled = false;
}
};

/* إنشاء حساب */
$("signupBtn").onclick = async()=>{
const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){
return showMessage("authMessage","اكتب البريد الإلكتروني وكلمة المرور");
}

if(password.length < 6){
return showMessage("authMessage","كلمة المرور لازم تكون 6 أحرف على الأقل");
}

$("signupBtn").disabled = true;
showMessage("authMessage","جاري إنشاء الحساب...");

try{
const {data,error} = await db.auth.signUp({email,password});
if(error)throw error;

if(data.session){
await updateSession(data.session);
}else{
showMessage("authMessage","راجع بريدك الإلكتروني لتأكيد الحساب");
}
}catch(error){
showMessage("authMessage",error.message || "تعذر إنشاء الحساب");
}finally{
$("signupBtn").disabled = false;
}
};

/* تسجيل الخروج */
$("logoutBtn").onclick = async()=>{
const {error} = await db.auth.signOut();
if(error){
alert(error.message);
return;
}
await updateSession(null);
};

/* إرسال الرسائل */
$("chatForm").onsubmit = async e=>{
e.preventDefault();

if(sending || !currentUser)return;

const message = $("message").value.trim();
if(!message)return;

const chat = activeChat();
if(!chat)return;

sending = true;
$("message").value = "";

chat.messages.push({
role:"user",
text:message
});

if(chat.title === "محادثة جديدة"){
chat.title = message.slice(0,25);
}

saveAndRender();
$("sendBtn").disabled = true;
$("newChatBtn").disabled = true;

chat.messages.push({
role:"assistant",
text:"جاري التفكير..."
});

saveAndRender();

try{
const {data,error} = await db.auth.getSession();
if(error)throw error;

const token = data.session?.access_token;
if(!token)throw new Error("سجل دخولك مرة تانية");

const controller = new AbortController();
const timeout = setTimeout(()=>controller.abort(),60000);

let response;

try{
response = await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body:JSON.stringify({message}),
signal:controller.signal
});
}finally{
clearTimeout(timeout);
}

const result = await response.json();

if(!response.ok){
throw new Error(result.error || "حصل خطأ في خدمة الذكاء الاصطناعي");
}

chat.messages[chat.messages.length-1].text =
result.reply || "مفيش رد متاح";

}catch(error){
chat.messages[chat.messages.length-1].text =
error.name === "AbortError"
? "الطلب استغرق وقت طويل. حاول تاني."
: "حصل خطأ: " + error.message;

}finally{
saveChats();
renderChat();
renderChatList();

sending = false;
$("sendBtn").disabled = false;
$("newChatBtn").disabled = false;
$("message").focus();
}
};

/* تغيير الوضع */
$("themeBtn").onclick = ()=>{
const light = document.body.classList.toggle("light-mode");

localStorage.setItem("alex-theme",light ? "light" : "dark");

$("themeBtn").textContent =
light ? "الوضع الأسود" : "الوضع الأبيض";
};

/* استرجاع الوضع */
if(localStorage.getItem("alex-theme") === "light"){
document.body.classList.add("light-mode");
$("themeBtn").textContent = "الوضع الأسود";
}

/* متابعة تسجيل الدخول */
db.auth.onAuthStateChange((_event,session)=>{
updateSession(session);
});

db.auth.getSession().then(({data,error})=>{
if(error){
console.error(error);
return;
}
updateSession(data.session);
});
</script>

</body>
</html>
