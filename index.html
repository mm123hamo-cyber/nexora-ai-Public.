
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEX AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080808;
color:#fff;
font-family:Arial,sans-serif;
transition:.2s
}
header{
padding:20px;
font-size:25px;
font-weight:bold;
border-bottom:1px solid #292929;
display:flex;
justify-content:space-between;
align-items:center
}
main{max-width:850px;margin:auto;padding:20px}
h1{text-align:center;margin-top:45px;font-size:34px}
h1 span{color:#aaa}
p{text-align:center;color:#aaa}
.panel{
background:#151515;
border:1px solid #303030;
border-radius:16px;
padding:16px;
margin:20px 0
}
input{
width:100%;
padding:14px;
margin:7px 0;
background:#090909;
color:white;
border:1px solid #444;
border-radius:10px;
font-size:15px
}
button{
background:#fff;
color:#000;
border:0;
border-radius:10px;
padding:12px 17px;
cursor:pointer;
font-weight:bold;
margin:4px
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#303030;color:white}
#chat{
height:48vh;
overflow:auto;
padding:10px
}
.msg{
padding:14px;
margin:10px 0;
border-radius:14px;
line-height:1.7;
white-space:pre-wrap;
overflow-wrap:anywhere
}
.user{background:#303030}
.bot{
background:#151515;
border:1px solid #333
}
form#chatForm{
display:flex;
gap:7px;
background:#151515;
padding:8px;
border:1px solid #444;
border-radius:15px
}
#message{
flex:1;
min-width:0;
background:transparent;
border:0;
outline:0;
color:white;
margin:0
}
small{
display:block;
text-align:center;
color:#888;
margin:12px
}
.hidden{display:none!important}

body.light-mode{
background:#f5f5f5;
color:#111
}
body.light-mode header{border-color:#ddd}
body.light-mode .panel,
body.light-mode .bot,
body.light-mode form#chatForm{
background:#fff;
color:#111;
border-color:#ddd
}
body.light-mode input{
background:#fff;
color:#111;
border-color:#ccc
}
body.light-mode .user{background:#e5e5e5}
body.light-mode .secondary{
background:#ddd;
color:#111
}
body.light-mode p{color:#555}
</style>
</head>

<body>

<header>
<span>◈ ALEX AI</span>
<button id="themeBtn" class="secondary">الوضع الأبيض</button>
</header>

<main>

<h1>أهلاً بك في <span>ALEX AI</span></h1>
<p>مساعدك الذكي في كل شيء</p>

<section id="auth" class="panel">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">دخول</button>
<button id="signupBtn" class="secondary">إنشاء حساب</button>
<p id="authMessage"></p>
</section>

<section id="app" class="hidden">

<div class="panel">
<span id="userEmail"></span>
<button id="logoutBtn" class="secondary">خروج</button>
</div>

<div id="chat"></div>

<form id="chatForm">
<input id="message" placeholder="اكتب رسالتك هنا..." required>
<button id="sendBtn" type="submit">➤</button>
</form>

<small>نسخة تجريبية من ALEX AI</small>
</section>

</main>

<script>
const SUPABASE_URL = "https://hbfdrtgmalvlixwuujgf.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_vBz40TiOn08eysk3uiQhYQ_lLv_QphJ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const $ = id => document.getElementById(id);

let currentUser = null;
let history = [];
let sending = false;

function showMessage(id,text){
  $(id).textContent = text;
}

function historyKey(){
  return "alex-chat-" + currentUser.id;
}

function saveHistory(){
  if(!currentUser)return;

  localStorage.setItem(
    historyKey(),
    JSON.stringify(history)
  );
}

function addMessage(role,text,save=true){
  const div = document.createElement("div");

  div.className =
    "msg " + (role === "user" ? "user" : "bot");

  div.textContent = text;

  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;

  if(save){
    history.push({role,text});
    saveHistory();
  }

  return div;
}

function loadHistory(){
  try{
    const saved = JSON.parse(
      localStorage.getItem(historyKey()) || "[]"
    );

    history = Array.isArray(saved) ? saved : [];

  }catch{
    history = [];
  }

  $("chat").replaceChildren();

  history.forEach(item=>{
    addMessage(item.role,item.text,false);
  });
}

async function updateSession(session){
  currentUser = session?.user || null;

  $("auth").classList.toggle("hidden",!!currentUser);
  $("app").classList.toggle("hidden",!currentUser);

  if(currentUser){
    $("userEmail").textContent =
      "الحساب: " + currentUser.email;

    loadHistory();
  }else{
    $("chat").replaceChildren();
    history = [];
  }
}

// تسجيل الدخول
$("loginBtn").onclick = async()=>{
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    return showMessage(
      "authMessage",
      "اكتب البريد الإلكتروني وكلمة المرور"
    );
  }

  $("loginBtn").disabled = true;

  showMessage(
    "authMessage",
    "جاري تسجيل الدخول..."
  );

  try{
    const {data,error} =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error)throw error;

    await updateSession(data.session);

  }catch(error){
    showMessage(
      "authMessage",
      error.message || "تعذر تسجيل الدخول"
    );
  }finally{
    $("loginBtn").disabled = false;
  }
};

// إنشاء حساب
$("signupBtn").onclick = async()=>{
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    return showMessage(
      "authMessage",
      "اكتب البريد الإلكتروني وكلمة المرور"
    );
  }

  if(password.length < 6){
    return showMessage(
      "authMessage",
      "كلمة المرور لازم تكون 6 أحرف على الأقل"
    );
  }

  $("signupBtn").disabled = true;

  showMessage(
    "authMessage",
    "جاري إنشاء الحساب..."
  );

  try{
    const {data,error} = await db.auth.signUp({
      email,
      password
    });

    if(error)throw error;

    if(data.session){
      await updateSession(data.session);
    }else{
      showMessage(
        "authMessage",
        "راجع بريدك الإلكتروني لتأكيد الحساب"
      );
    }

  }catch(error){
    showMessage(
      "authMessage",
      error.message || "تعذر إنشاء الحساب"
    );
  }finally{
    $("signupBtn").disabled = false;
  }
};

// تسجيل الخروج
$("logoutBtn").onclick = async()=>{
  const {error} = await db.auth.signOut();

  if(error){
    alert(error.message);
    return;
  }

  await updateSession(null);
};

// إرسال الرسائل
$("chatForm").onsubmit = async e=>{
  e.preventDefault();

  if(sending || !currentUser)return;

  const message = $("message").value.trim();

  if(!message)return;

  sending = true;

  $("message").value = "";

  addMessage("user",message);

  $("sendBtn").disabled = true;

  const thinkingMessage = addMessage(
    "bot",
    "جاري التفكير..."
  );

  try{
    const {data,error} = await db.auth.getSession();

    if(error)throw error;

    const token = data.session?.access_token;

    if(!token){
      throw new Error("سجل دخولك مرة تانية");
    }

    const controller = new AbortController();

    const timeout = setTimeout(()=>{
      controller.abort();
    },60000);

    let response;

    try{
      response = await fetch("/api/chat",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({message}),
        signal:controller.signal
      });
    }finally{
      clearTimeout(timeout);
    }

    const result = await response.json();

    if(!response.ok){
      throw new Error(
        result.error || "حصل خطأ في خدمة الذكاء الاصطناعي"
      );
    }

    thinkingMessage.textContent =
      result.reply || "مفيش رد متاح";

  }catch(error){

    if(error.name === "AbortError"){
      thinkingMessage.textContent =
        "الطلب استغرق وقت طويل. حاول تاني.";
    }else{
      thinkingMessage.textContent =
        "حصل خطأ: " + error.message;
    }

  }finally{

    const index = history.length - 1;

    if(index >= 0){
      history[index].text =
        thinkingMessage.textContent;

      saveHistory();
    }

    sending = false;
    $("sendBtn").disabled = false;
    $("message").focus();

    $("chat").scrollTop =
      $("chat").scrollHeight;
  }
};

// تغيير الوضع
$("themeBtn").onclick = ()=>{
  const light =
    document.body.classList.toggle("light-mode");

  localStorage.setItem(
    "alex-theme",
    light ? "light" : "dark"
  );

  $("themeBtn").textContent =
    light ? "الوضع الأسود" : "الوضع الأبيض";
};

// استرجاع الوضع المحفوظ
if(localStorage.getItem("alex-theme") === "light"){
  document.body.classList.add("light-mode");
  $("themeBtn").textContent = "الوضع الأسود";
}

// متابعة تسجيل الدخول
db.auth.onAuthStateChange((_event,session)=>{
  updateSession(session);
});

// استرجاع الجلسة عند فتح الموقع
db.auth.getSession().then(({data,error})=>{
  if(error){
    console.error(error);
    return;
  }

  updateSession(data.session);
});

</script>

</body>
</html>
